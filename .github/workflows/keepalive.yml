name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -s "${SUPABASE_URL}/auth/v1/health"
